name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require matching version and a commit already on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_guard.py tag "$RELEASE_TAG"
  checks:
    needs: release-guard
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write
  publish:
    needs: [release-guard, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck tag invariants before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_guard.py tag "$RELEASE_TAG"
      - name: Require an explicit tested artifact ID
        env:
          TESTED_ARTIFACT_ID: ${{ needs.checks.outputs.artifact-id }}
        run: '[[ "$TESTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: verified-dist
          merge-multiple: true
      - name: Verify exact tested artifacts, upload draft, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TESTED_ARTIFACT_ID: ${{ needs.checks.outputs.artifact-id }}
        run: python3 scripts/publish_release.py verified-dist
