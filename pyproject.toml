[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "llm-usage-dashboard"
version = "0.14.1"
description = "Private self-hosted LLM quota and usage dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "gunicorn>=25.1,<27", "Werkzeug>=3.1.9,<4", "backports.zstd>=1.8,<2; python_version<'3.14'"]
[project.urls]
Homepage = "https://github.com/jihoon22-lee/llm-usage-dashboard"
Documentation = "https://github.com/jihoon22-lee/llm-usage-dashboard/tree/main/docs"
Issues = "https://github.com/jihoon22-lee/llm-usage-dashboard/issues"
[project.scripts]
llm-usage = "llm_usage.cli:main"
[tool.setuptools.package-data]
llm_usage = ["web/*"]
[tool.setuptools.packages.find]
include = ["llm_usage*"]

[dependency-groups]
dev = ["pip-audit==2.10.1", "playwright==1.64.1", "ruff==0.17.5"]

[tool.uv]
# pip-audit's file cache must not resolve the vulnerable pre-4.2.1 releases.
constraint-dependencies = ["filelock>=4.2.1"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes and bugbear: unused names, undefined names and likely bugs. Style is the formatter's.
select = ["F", "B"]
# B905: zip() pairs sequences this code builds to the same length.
# B007: a loop that unpacks a row often needs only some of its fields.
# B023: the closures defined in loops here are called within the same iteration.
ignore = ["B905", "B007", "B023"]

[tool.ruff.format]
quote-style = "preserve"
